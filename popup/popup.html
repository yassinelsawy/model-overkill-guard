<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="logo">🧭</span>
      <div>
        <h1>Model Overkill Guard</h1>
        <p class="subtitle">Nudges toward the right model, not just the biggest one.</p>
      </div>
    </header>

    <section class="group">
      <label class="row toggle-row">
        <span>
          <strong>Block overkill sends</strong>
          <small>Confirm before sending a simple prompt to a heavy model</small>
        </span>
        <input type="checkbox" id="enabled" />
      </label>

      <label class="row toggle-row">
        <span>
          <strong>Remind me on new chats</strong>
          <small>Toast when opening a fresh chat, before you start typing</small>
        </span>
        <input type="checkbox" id="newChatAlertsEnabled" />
      </label>
    </section>

    <section class="group">
      <label class="row">
        <span>Sensitivity</span>
        <select id="sensitivity">
          <option value="lenient">Lenient</option>
          <option value="balanced">Balanced</option>
          <option value="strict">Strict</option>
        </select>
      </label>

      <label class="row toggle-row">
        <span>Also flag Sonnet as overkill</span>
        <input type="checkbox" id="flagSonnet" />
      </label>
    </section>

    <details class="group">
      <summary>Custom keywords</summary>
      <label class="block">
        Extra "simple" keywords (comma-separated)
        <textarea id="simpleKeywords" rows="2"></textarea>
      </label>
      <label class="block">
        Extra "complex" keywords (comma-separated)
        <textarea id="complexKeywords" rows="2"></textarea>
      </label>
      <button id="reset">Reset to defaults</button>
    </details>

    <p class="status" id="status">&nbsp;</p>

    <script src="../content/config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
